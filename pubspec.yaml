name: miracle_tv

description: MIRACLE TV - Android app for MEFDN.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  youtube_player_flutter: ^9.0.3
  cupertino_icons: ^1.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.6.1
  http: ^1.2.0
  provider: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logos/
